name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Core tests
        run: cargo test -p bifur-core
      - name: Flutter bridge check
        run: cargo check -p bifur-bridge

  gpui_frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GPUI frontend check
        run: cargo check -p bifur
