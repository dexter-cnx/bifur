[workspace]
members = ["crates/core", "crates/gpui_app", "crates/bridge"]
resolver = "2"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
notify = "6.1"
walkdir = "2.4"
rayon = "1.8"
mime_guess = "2.0"
portable-pty = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
regex = "1.10"
anyhow = "1.0"
flutter_rust_bridge = "2.6"
